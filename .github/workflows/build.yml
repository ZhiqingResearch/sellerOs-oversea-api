name: builder

on:
  push:
    branches:
      - develop
      - release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/dinglan-backend/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix={{branch}}-
          # tag 事件默认会追加 :latest（latest=auto），导致 outputs.tags 变多行
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}

      - name: Print image URL
        run: echo "Image pushed - ${{ steps.meta.outputs.tags }}"

      - name: Get Jenkins CRUMB
        id: get-crumb
        run: |
          CRUMB=$(curl -s -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | jq -r .crumb)
          echo "crumb=$CRUMB" >> "$GITHUB_OUTPUT"

      # dev 环境：develop 分支推送自动部署到 sourcing-api-dev
      - name: Notify Jenkins dev (develop 环境)
        if: github.ref == 'refs/heads/develop'
        env:
          CRUMB: ${{ steps.get-crumb.outputs.crumb }}
        run: |
          IMAGE_TAG="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          curl -X POST \
            -H "Jenkins-Crumb: $CRUMB" \
            -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/sourcing-api-dev/buildWithParameters" \
            --data token=${{ secrets.JENKINS_BUILD_TOKEN }} \
            --data IMAGE_TAG="${IMAGE_TAG}"

      # release 环境：release 分支推送自动部署到 selleros-oversea-api-prod
      - name: Notify Jenkins release (生产环境)
        if: github.ref == 'refs/heads/release'
        env:
          CRUMB: ${{ steps.get-crumb.outputs.crumb }}
        run: |
          IMAGE_TAG="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          curl -X POST \
            -H "Jenkins-Crumb: $CRUMB" \
            -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/selleros-oversea-api-prod/buildWithParameters" \
            --data token=${{ secrets.JENKINS_BUILD_TOKEN }} \
            --data IMAGE_TAG="${IMAGE_TAG}"
